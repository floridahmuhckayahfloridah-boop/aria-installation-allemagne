<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ariaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="50%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c68f" />
      <stop offset="100%" stop-color="#d49a3d" />
    </linearGradient>
  </defs>
  <!-- Background with smooth squircle -->
  <rect width="512" height="512" rx="128" fill="url(#ariaGrad)" />
  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#52b788" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Stylized Compass / Bridge Motif -->
  <g transform="translate(256, 230)">
    <!-- Germany - Madagascar Connection Arch -->
    <path d="M -120 70 C -120 -80, 120 -80, 120 70" fill="none" stroke="#74c69d" stroke-width="12" stroke-linecap="round" />
    <path d="M -80 70 C -80 -40, 80 -40, 80 70" fill="none" stroke="#52b788" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 8" />

    <!-- Central Navigator Star / Sprout (Autonomy & Guidance) -->
    <path d="M 0 -110 L 16 -30 L 90 -16 L 26 26 L 40 100 L 0 50 L -40 100 L -26 26 L -90 -16 L -16 -30 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-5" r="16" fill="#143627" />
    <circle cx="0" cy="-5" r="8" fill="#d8f3dc" />

    <!-- German Flag Accent subtle dots -->
    <circle cx="-120" cy="74" r="14" fill="#2d6a4f" />
    <circle cx="-120" cy="74" r="8" fill="#ffb703" />

    <!-- Madagascar Ravenala Leaf Accent -->
    <circle cx="120" cy="74" r="14" fill="#2d6a4f" />
    <circle cx="120" cy="74" r="8" fill="#e63946" />
  </g>

  <!-- Title ARIA -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="8" text-anchor="middle">ARIA</text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500" fill="#95d5b2" letter-spacing="2" text-anchor="middle">ALLEMAGNE • AUTONOMIE</text>
</svg>
